<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">SkillDiff: follow the files behind SKILL.md</title>
<desc id="desc">A review workflow illustration. An unchanged SKILL.md references a changed workflow and script. Three changed files produce four new literal review signals.</desc>
<rect width="1200" height="620" rx="16" fill="#f5f7f1"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#18272b">
<rect x="42" y="36" width="36" height="36" rx="10" fill="#11664e"/><text x="50" y="63" font-size="28" fill="white">Δ</text>
<text x="92" y="63" font-size="25" font-weight="700">SkillDiff</text><text x="960" y="59" font-size="12" fill="#11664e" letter-spacing="2">LOCAL · OFFLINE</text>
<path d="M42 94H1158" stroke="#d7e0d9"/>
<text x="42" y="145" font-size="12" fill="#11664e" letter-spacing="2">AGENT SKILLS / UPDATE REVIEW</text>
<text x="42" y="209" font-size="48" font-weight="650" letter-spacing="-2">Small update.</text>
<text x="42" y="266" font-size="48" font-weight="650" letter-spacing="-2" fill="#11664e">See the whole change.</text>
<text x="44" y="307" font-size="17" fill="#627176">The entrypoint stayed the same. The files behind it did not.</text>
<rect x="810" y="140" width="348" height="175" rx="12" fill="#e8eee5"/>
<text x="838" y="178" font-size="12" fill="#627176">INCLUDED DEMO</text>
<text x="838" y="236" font-size="45" font-weight="600">03</text><text x="944" y="236" font-size="45" font-weight="600" fill="#11664e">+04</text>
<text x="838" y="270" font-size="13" fill="#627176">changed files</text><text x="944" y="270" font-size="13" fill="#627176">literal signals</text>
<g font-family="Consolas,monospace" font-size="15">
<rect x="42" y="356" width="285" height="112" rx="10" fill="white" stroke="#d7e0d9"/>
<text x="62" y="392" font-size="11" fill="#627176">UNCHANGED ENTRYPOINT</text><text x="62" y="430" font-weight="700">SKILL.md</text>
<path d="M339 412H407m-8-7 8 7-8 7" stroke="#7a9d89" stroke-width="2" fill="none"/>
<rect x="420" y="356" width="320" height="112" rx="10" fill="white" stroke="#b8cdbd"/>
<text x="440" y="392" font-size="11" fill="#11664e">MODIFIED REFERENCE</text><text x="440" y="430" font-weight="700">references/workflow.md</text>
<path d="M752 412H820m-8-7 8 7-8 7" stroke="#7a9d89" stroke-width="2" fill="none"/>
<rect x="833" y="356" width="325" height="112" rx="10" fill="white" stroke="#b8cdbd"/>
<text x="853" y="392" font-size="11" fill="#11664e">MODIFIED SCRIPT</text><text x="853" y="430" font-weight="700">scripts/summarize.py</text>
</g>
<rect x="42" y="497" width="1116" height="71" rx="9" fill="#eaf0e9"/>
<text x="62" y="525" font-size="14" font-weight="600">Trace references. Inspect exact diffs. Keep the review.</text>
<text x="62" y="550" font-size="12" fill="#627176">Signals are literal evidence, not proof of execution. Every file change stays visible.</text>
<text x="1058" y="600" font-size="10" fill="#627176">WORKFLOW DIAGRAM</text>
</g></svg>
